<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-display);overflow:hidden}</style></head><body><div style="background:var(--paper);height:150px;display:flex;gap:28px;align-items:center;padding:0 30px;font:var(--text-micro)"><div style="width:130px;height:56px;background:var(--blood-600);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))"></div><div style="width:120px;height:34px;background:var(--rust-700);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)"></div><div style="width:4px;height:70px;background:var(--smoke-500)"></div><div style="width:120px;height:60px;border-top:1px dashed var(--ink);border-bottom:1px dashed var(--ink)"></div></div></body></html>
