<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-display);overflow:hidden}</style></head><body><style>.g{position:relative;display:inline-block;font:900 54px/.9 var(--font-display);letter-spacing:-.05em}.g i{position:absolute;inset:0;font-style:normal}</style><div style="background:var(--paper);height:160px;display:flex;gap:40px;align-items:center;padding:0 30px"><span class="g"><span style="display:inline-block;animation:y2k-shake 2s linear infinite">Tear.</span><i style="color:var(--blood-600);animation:y2k-slice-a 2s steps(1) infinite">Tear.</i><i style="color:var(--ink);animation:y2k-slice-b 2s steps(1) .08s infinite">Tear.</i></span><span style="font:italic 900 18px var(--font-display);color:var(--blood-600);animation:y2k-flicker 2.4s linear infinite">ATTENTION!!</span><div style="width:120px;height:80px;background:var(--blood-600);animation:y2k-tv-on 1.6s var(--ease-out) infinite alternate"></div></div></body></html>
